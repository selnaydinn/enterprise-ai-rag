version: '3.8'

services:
  rag-backend:
    build: .
    container_name: meb_rag_backend
    ports:
      - "8000:8000"  # Next.js frontend uygulamasının bağlanacağı API portu
    volumes:
      - .:/app       # Kodda yapacağın değişikliklerin anında güncellenmesini sağlar
      # PDF'LERİN UÇMASINI ENGELLEYEN KALICI VOLUME:
      - ./uploaded_pdfs:/app/uploaded_pdfs
      #HuggingFace model önbelleği (e5 + reranker, ~1.6 GB): ilk açılışta bir kez iner, konteyner yeniden oluşturulsa da kalır
      #Silmek için: docker volume ls ile adını bulup docker volume rm
      - hf_cache:/models

    #Proje klasöründeki .env dosyasını container içine yükler
    env_file:
      - .env

    #Modeller volume'daki klasöre indirilir ve oradan okunur
    environment:
      - HF_HOME=/models
      #Açılışta HuggingFace'e sürüm kontrolü isteği atılmaz; modeller yalnızca volume'dan okunur (internetsiz de açılır)
      #Volume boşken (ilk kurulum, volume silindiğinde, model değiştiğinde) modeller inemez: geçici olarak 0 yapın, bir kez açın, sonra geri 1
      - HF_HUB_OFFLINE=1

    #Gemini API bağlantı sorunlarını ve retrying hatalarını çözen DNS ayarı
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    # Bilgisayarının kilitlenmesini engelleyen 3 GB RAM ve işlemci sınırı:
    deploy:
      resources:
        limits:
          cpus: '2.0'       # İşlemcinin (Ryzen) en fazla 2 çekirdeğini kullanabilir
          memory: 3000M     # RAM kullanımı 3000 MB'ı (3 GB) kesinlikle geçemez

#Docker'ın yönettiği kalıcı alan (proje klasöründe görünmez)
volumes:
  hf_cache:
